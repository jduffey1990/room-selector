<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room Selector 5000</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #ffffff 50%, #faf5ff 100%);
        color: #111827; padding: 24px;
      }
      main { max-width: 34rem; text-align: center; }
      h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); margin: 0 0 .5rem; letter-spacing: -0.02em; }
      p { color: #4b5563; line-height: 1.6; margin: 0 auto; max-width: 28rem; }
      .badge {
        display: inline-block; margin-bottom: 1.25rem; padding: .35rem .75rem;
        border-radius: 999px; background: #e0e7ff; color: #3730a3;
        font-size: .8rem; font-weight: 600; letter-spacing: .02em;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Coming soon</span>
      <h1>Room Selector 5000</h1>
      <p>
        A fairer way for a group to divide up beds &mdash; and what everyone pays &mdash;
        without anyone feeling outbid. Launching shortly.
      </p>
    </main>
  </body>
</html>
