    <!-- AdSense site verification. Deliberately the meta tag and NOT the
         loader snippet: a script in <head> would load ad code on every route
         of this SPA, including the submission form and the results page, and
         P2.2 forbids ads in money or fairness UI. The meta tag proves
         ownership while shipping no ad code at all. The loader is injected at
         runtime, per route, by src/ads.js -- which is also why grepping the
         served HTML for the loader filename must come back empty. -->
    <meta name="google-adsense-account" content="ca-pub-6539967757276332" />

  </head>
